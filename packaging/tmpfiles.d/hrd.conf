d /etc/cordial-hrd            0755 root    root    -
d /var/lib/cordial-hrd        0700 cordial cordial -
d /var/log/cordial-hrd        0700 cordial cordial -
d /run/cordial-hrd            0750 cordial cordial -
# Root-owned, writable only by the helper: the entry wrapper refuses a namespace
# directory anyone else could have touched.
d /run/cordial-hrd-netns      0755 root    root    -
d /var/lib/cordial-hrd-netd   0700 root    root    -
